<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적용 공고 도우미</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --line:#d9d9d4; --text:#222; --muted:#666; --warn-bg:#fff4e0; --warn-line:#e0a040; --accent:#2f5d8a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height:1.5; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.1rem; margin:0 0 12px; }
  h3 { font-size:1rem; margin:0 0 8px; }
  .notice { background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:6px; padding:10px 12px; font-weight:bold; margin-bottom:16px; }
  .inputs { display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:720px) { .inputs { grid-template-columns:1fr 1fr; } }
  .box { border:1px solid var(--line); border-radius:6px; padding:12px; min-width:0; }
  .hint { color:var(--muted); font-size:.9rem; margin:4px 0 8px; }
  .count { margin:8px 0; font-weight:bold; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; white-space:nowrap; }
  th { background:#eef1f4; }
  button { padding:8px 16px; font-size:1rem; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button:disabled { background:#ccc; border-color:#ccc; color:#666; }
  tr.need-check td { background:var(--warn-bg); }
  .empty { color:var(--muted); border:1px dashed var(--line); border-radius:6px; padding:16px; text-align:center; }
  .error { color:#a12a1a; font-weight:bold; margin:8px 0; }
  .error:empty { display:none; }
</style>
</head>
<body>
<main>
  <h1>민원 '적용 공고' 칸 자동 기재 도우미</h1>

  <section id="screen-upload">
    <h2>1. 파일 올리기</h2>
    <p class="notice">가상 표본만 넣으세요. 실제 민원 자료를 올리지 마세요</p>
    <div class="inputs">
      <div class="box">
        <h3>민원대장 CSV</h3>
        <p class="hint">열: 접수번호, 접수일, 사업명, 민원요지</p>
        <input type="file" id="file-complaints" accept=".csv,text/csv">
        <p class="count" id="count-complaints"></p>
        <p class="error" id="error-complaints" role="alert"></p>
        <div class="table-wrap" id="preview-complaints"></div>
      </div>
      <div class="box">
        <h3>공고 이력 CSV</h3>
        <p class="hint">열: 사업명, 공고구분, 게시일</p>
        <input type="file" id="file-notices" accept=".csv,text/csv">
        <p class="count" id="count-notices"></p>
        <p class="error" id="error-notices" role="alert"></p>
        <div class="table-wrap" id="preview-notices"></div>
      </div>
    </div>
    <p style="margin-top:16px"><button type="button" id="btn-match">매칭</button></p>
    <p class="error" id="error-match" role="alert"></p>
  </section>

  <section id="screen-result">
    <h2>2. 매칭 결과</h2>
    <div id="result-area"><div class="empty">매칭 결과가 여기에 표시됩니다.</div></div>
  </section>

  <section id="screen-backup">
    <h2>3. 저장·백업</h2>
    <p class="hint">매칭 결과는 이 브라우저에 자동 저장됩니다(키 <code>m5_notice_match</code>). 다른 PC로 옮기거나 백업하려면 JSON 파일을 쓰세요.</p>
    <p>
      <button type="button" id="btn-export">JSON 내보내기</button>
      <button type="button" id="btn-import">JSON 가져오기</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </p>
    <p class="error" id="error-backup" role="alert"></p>
    <p class="hint" id="backup-status"></p>
  </section>
</main>

<script>
// CSV 글을 { header, rows }로 나눈다. BOM 제거, CRLF/LF 처리, 빈 줄 무시, 따옴표 칸 처리.
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var records = [], row = [], field = '', inQuotes = false, i, c;
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); records.push(row); row = []; field = '';
    } else { field += c; }
  }
  if (field !== '' || row.length) { row.push(field); records.push(row); }
  records = records.filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); });
  return { header: records.length ? records[0] : [], rows: records.slice(1) };
}

// YYYY-MM-DD 형식이고 실제 있는 날짜인지 본다.
function isValidDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p = s.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
}

var STATUS_OK = '담당 검토 후 확정';
var REASON = {
  date: '확인 필요: 날짜 형식 오류',
  noProject: '확인 필요: 공고 이력에 해당 사업 없음',
  sameDay: '확인 필요: 접수일과 같은 날 게시된 공고 있음',
  noPrior: '확인 필요: 접수일 전 게시된 공고 없음'
};

// 머리행 이름으로 열 위치를 찾아 행을 객체로 바꾼다. 값은 앞뒤 공백만 제거한다.
function toObjects(data, cols) {
  var idx = cols.map(function (c) { return data.header.map(function (h) { return h.trim(); }).indexOf(c); });
  return data.rows.map(function (r) {
    var o = {};
    cols.forEach(function (c, k) { o[c] = idx[k] < 0 ? '' : String(r[idx[k]] == null ? '' : r[idx[k]]).trim(); });
    return o;
  });
}

// PRD 3절 매칭 규칙. 민원마다 { 접수번호, 접수일, 사업명, 적용공고, 근거, 상태 }를 돌려준다.
function matchComplaints(complaintsData, noticesData) {
  var complaints = toObjects(complaintsData, ['접수번호', '접수일', '사업명']);
  var notices = toObjects(noticesData, ['사업명', '공고구분', '게시일']);
  return complaints.map(function (c) {
    var out = { 접수번호: c.접수번호, 접수일: c.접수일, 사업명: c.사업명, 적용공고: '', 근거: '', 상태: '' };
    var same = notices.filter(function (n) { return n.사업명 === c.사업명; });
    if (!isValidDate(c.접수일) || same.some(function (n) { return !isValidDate(n.게시일); })) {
      out.상태 = REASON.date; return out;
    }
    if (!same.length) { out.상태 = REASON.noProject; return out; }
    if (same.some(function (n) { return n.게시일 === c.접수일; })) { out.상태 = REASON.sameDay; return out; }
    var before = same.filter(function (n) { return n.게시일 < c.접수일; })
      .sort(function (a, b) { return a.게시일 < b.게시일 ? -1 : a.게시일 > b.게시일 ? 1 : 0; });
    if (!before.length) { out.상태 = REASON.noPrior; return out; }
    var pick = before[before.length - 1];
    var after = same.filter(function (n) { return n.게시일 > c.접수일; })
      .sort(function (a, b) { return a.게시일 < b.게시일 ? -1 : a.게시일 > b.게시일 ? 1 : 0; });
    out.적용공고 = pick.공고구분;
    out.근거 = after.length
      ? '접수일 당시 유효 — ' + after[0].공고구분 + '는 ' + after[0].게시일 + ' 게시'
      : pick.공고구분 + ', ' + pick.게시일 + ' 게시';
    out.상태 = STATUS_OK;
    return out;
  });
}

// PRD 4절 입력 열.
var REQUIRED_COLS = {
  complaints: ['접수번호', '접수일', '사업명', '민원요지'],
  notices: ['사업명', '공고구분', '게시일']
};
var MSG_BOTH_FILES = '민원대장과 공고 이력 파일을 모두 넣어 주세요';
var MSG_NO_ROWS = '행이 없습니다';

// 읽은 CSV를 검사해 오류 문구 목록을 돌려준다. 빈 목록이면 통과.
function checkInput(kind, data) {
  var errors = [];
  var header = data.header.map(function (h) { return h.trim(); });
  if (header.length) {
    var missing = REQUIRED_COLS[kind].filter(function (c) { return header.indexOf(c) < 0; });
    if (missing.length) errors.push('없는 열: ' + missing.join(', ') + ' (필요한 열: ' + REQUIRED_COLS[kind].join(', ') + ')');
  }
  if (!data.rows.length) errors.push(MSG_NO_ROWS);
  return errors;
}

var PREVIEW_ROWS = 5;
var loaded = { complaints: null, notices: null };

// 읽은 행 수와 처음 PREVIEW_ROWS행을 표로 보여 준다. 값은 textContent로만 넣는다.
function renderPreview(kind, fileName, data) {
  var countEl = document.getElementById('count-' + kind);
  var wrap = document.getElementById('preview-' + kind);
  countEl.textContent = fileName + ' — 읽은 행 수: ' + data.rows.length + '행';
  wrap.textContent = '';
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  data.header.forEach(function (h) {
    var th = document.createElement('th'); th.textContent = h; hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  data.rows.slice(0, PREVIEW_ROWS).forEach(function (r) {
    var tr = document.createElement('tr');
    r.forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); wrap.appendChild(table);
  if (data.rows.length > PREVIEW_ROWS) {
    var more = document.createElement('p'); more.className = 'hint';
    more.textContent = '처음 ' + PREVIEW_ROWS + '행만 보여 줍니다.';
    wrap.appendChild(more);
  }
}

function bindInput(kind) {
  document.getElementById('file-' + kind).addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      loaded[kind] = parseCsv(String(reader.result));
      renderPreview(kind, file.name, loaded[kind]);
      document.getElementById('error-' + kind).textContent = checkInput(kind, loaded[kind]).join(' / ');
      document.getElementById('error-match').textContent = '';
    };
    reader.readAsText(file, 'UTF-8');
  });
}

var RESULT_COLS = [['접수번호', '접수번호'], ['접수일', '접수일'], ['사업명', '사업명'], ['적용 공고', '적용공고'], ['근거', '근거'], ['상태', '상태']];

// 건수 요약과 결과 표를 그린다. 값은 textContent로만 넣는다.
function renderResult(results) {
  var area = document.getElementById('result-area');
  var okCount = results.filter(function (r) { return r.상태 === STATUS_OK; }).length;
  area.textContent = '';
  var summary = document.createElement('p'); summary.className = 'count'; summary.id = 'result-summary';
  summary.textContent = '매칭 ' + okCount + '건 / 확인 필요 ' + (results.length - okCount) + '건';
  area.appendChild(summary);
  var wrap = document.createElement('div'); wrap.className = 'table-wrap';
  var table = document.createElement('table'); table.id = 'result-table';
  var thead = document.createElement('thead'); var hr = document.createElement('tr');
  RESULT_COLS.forEach(function (c) { var th = document.createElement('th'); th.textContent = c[0]; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  var tbody = document.createElement('tbody');
  results.forEach(function (r) {
    var tr = document.createElement('tr');
    if (r.상태 !== STATUS_OK) tr.className = 'need-check';
    RESULT_COLS.forEach(function (c) { var td = document.createElement('td'); td.textContent = r[c[1]]; tr.appendChild(td); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); wrap.appendChild(table); area.appendChild(wrap);
}

// PRD 4절: localStorage 키는 이것 하나만 쓴다.
var STORE_KEY = 'm5_notice_match';
var STORE_VERSION = 1;
var RESULT_FIELDS = RESULT_COLS.map(function (c) { return c[1]; });

// 저장 형식: { version, savedAt, notices:{header,rows}, results:[{접수번호,…,상태}] }
function makeSnapshot(noticesData, results) {
  return { version: STORE_VERSION, savedAt: new Date().toISOString(),
    notices: { header: noticesData.header, rows: noticesData.rows }, results: results };
}

// 형식이 맞는 저장값인지 본다. 맞으면 true.
function isValidSnapshot(s) {
  if (!s || typeof s !== 'object' || s.version !== STORE_VERSION) return false;
  if (!s.notices || !Array.isArray(s.notices.header) || !Array.isArray(s.notices.rows)) return false;
  if (!Array.isArray(s.results)) return false;
  return s.results.every(function (r) {
    return r && typeof r === 'object' && RESULT_FIELDS.every(function (f) { return typeof r[f] === 'string'; });
  });
}

function saveSnapshot(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; } catch (e) { return false; }
}

function loadSnapshot() {
  try {
    var s = JSON.parse(localStorage.getItem(STORE_KEY));
    return isValidSnapshot(s) ? s : null;
  } catch (e) { return null; }
}

// 저장된 결과를 화면에 다시 그린다. 언제 저장한 것인지 함께 보여 준다.
function showSnapshot(s, label) {
  renderResult(s.results);
  var note = document.createElement('p'); note.className = 'hint'; note.id = 'result-source';
  note.textContent = label + ' (저장 시각 ' + s.savedAt.replace('T', ' ').slice(0, 19) + ' UTC, 공고 이력 ' + s.notices.rows.length + '행)';
  document.getElementById('result-area').insertBefore(note, document.getElementById('result-area').firstChild);
}

if (typeof document !== 'undefined') {
  bindInput('complaints');
  bindInput('notices');
  document.getElementById('btn-match').addEventListener('click', function () {
    var msg = document.getElementById('error-match');
    if (!loaded.complaints || !loaded.notices) { msg.textContent = MSG_BOTH_FILES; return; }
    var bad = ['complaints', 'notices'].filter(function (k) { return checkInput(k, loaded[k]).length; });
    if (bad.length) {
      msg.textContent = '파일 오류가 있어 매칭하지 않았습니다. ' +
        bad.map(function (k) { return (k === 'complaints' ? '민원대장' : '공고 이력') + ': ' + checkInput(k, loaded[k]).join(' / '); }).join(' · ');
      return;
    }
    msg.textContent = '';
    var snap = makeSnapshot(loaded.notices, matchComplaints(loaded.complaints, loaded.notices));
    renderResult(snap.results);
    if (!saveSnapshot(snap)) msg.textContent = '브라우저에 저장하지 못했습니다. 새로 고치면 결과가 사라집니다.';
  });
  var saved = loadSnapshot();
  if (saved) showSnapshot(saved, '브라우저에 저장된 마지막 결과입니다');

  var backupErr = document.getElementById('error-backup');
  var backupStatus = document.getElementById('backup-status');

  // 저장값을 JSON 파일로 내려받는다. 외부 요청 없이 Blob 주소만 쓴다.
  document.getElementById('btn-export').addEventListener('click', function () {
    backupErr.textContent = ''; backupStatus.textContent = '';
    var s = loadSnapshot();
    if (!s) { backupErr.textContent = '내보낼 결과가 없습니다. 먼저 [매칭]을 누르세요.'; return; }
    var blob = new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'm5_notice_match_' + s.savedAt.slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    backupStatus.textContent = a.download + ' 파일을 내보냈습니다.';
  });

  document.getElementById('btn-import').addEventListener('click', function () {
    document.getElementById('file-import').click();
  });

  // 형식이 맞는 JSON만 저장하고 결과 표를 다시 그린다.
  document.getElementById('file-import').addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    backupErr.textContent = ''; backupStatus.textContent = '';
    var reader = new FileReader();
    reader.onload = function () {
      var s = null;
      try { s = JSON.parse(String(reader.result)); } catch (err) { s = null; }
      if (!isValidSnapshot(s)) {
        backupErr.textContent = '형식이 다른 JSON이라 가져오지 않았습니다. 이 도구의 [JSON 내보내기]로 만든 파일을 넣어 주세요.';
        return;
      }
      if (!saveSnapshot(s)) backupErr.textContent = '브라우저에 저장하지 못했습니다. 새로 고치면 결과가 사라집니다.';
      showSnapshot(s, file.name + '에서 가져온 결과입니다');
      backupStatus.textContent = file.name + '을(를) 가져왔습니다.';
    };
    reader.readAsText(file, 'UTF-8');
  });
}
</script>
</body>
</html>
